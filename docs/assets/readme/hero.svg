<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="hero-title">制造工艺质量知识图谱 · GraphRAG 全链路与公平评测</title>
  <desc id="desc">左侧为项目名称与价值描述，右侧为平台内真实的「不良现象 → 原因 → 对策 → 工序」2 跳归因链路，节点颜色对应六类实体。</desc>

  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a63ef"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27c2bf"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8596"/>
    </marker>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="420" rx="18" fill="#141a24"/>

  <!-- ===================== LEFT · title block ===================== -->
  <g id="title-block">
    <text x="56" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="2" fill="#0a9f5c">MANUFACTURING KG · GRAPHRAG · 150-QUESTION BENCHMARK</text>

    <text x="56" y="132" font-size="48" font-weight="700" fill="#f2f5fa">制造工艺质量知识图谱</text>
    <text x="56" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15.5" fill="#8a93a5">Manufacturing Quality Knowledge Graph &amp; GraphRAG</text>

    <text x="56" y="216" font-size="20" fill="#c9d2e0">200 份制造文档 → LLM 分块抽取对齐 → 4,672 节点图谱</text>
    <text x="56" y="248" font-size="20" fill="#c9d2e0">BM25 / 向量 / GraphRAG 三路同预算公平评测</text>
    <text x="56" y="280" font-size="20" fill="#c9d2e0">消融证明：多跳因果链枚举，图谱通道不可替代</text>

    <g id="metrics" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16.5">
      <text x="56" y="352" fill="#8a93a5">实体 F1 <tspan fill="#f2f5fa" font-weight="700">0.92</tspan></text>
      <text x="218" y="352" fill="#8a93a5">多跳 Hit@3 <tspan fill="#f2f5fa" font-weight="700">0.98</tspan></text>
      <text x="430" y="352" fill="#8a93a5">端到端 <tspan fill="#f2f5fa" font-weight="700">0.68</tspan><tspan fill="#5d6678"> vs </tspan><tspan fill="#e8483d" font-weight="700">0.04</tspan></text>
      <text x="56" y="386" font-size="12.5" fill="#5d6678">4,672 nodes · 8,891 edges · 300 条冻结抽检 · 数字均由流水线真实产出</text>
    </g>
  </g>

  <!-- ===================== RIGHT · real 2-hop causal chain ===================== -->
  <g id="project-proof">
    <!-- relation legend -->
    <g font-size="14" fill="#8a93a5">
      <line x1="700" y1="62" x2="730" y2="62" stroke="#9a63ef" stroke-width="2" marker-end="url(#arrow-purple)"/>
      <text x="738" y="67">归因于</text>
      <line x1="812" y1="62" x2="842" y2="62" stroke="#27c2bf" stroke-width="2" marker-end="url(#arrow-teal)"/>
      <text x="850" y="67">对策为</text>
      <line x1="924" y1="62" x2="954" y2="62" stroke="#7b8596" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
      <text x="962" y="67">物料 / 设备关联</text>
    </g>

    <!-- edges: defect -> cause -> countermeasure -->
    <line x1="732" y1="124" x2="782" y2="124" stroke="#9a63ef" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <line x1="926" y1="124" x2="976" y2="124" stroke="#27c2bf" stroke-width="2" marker-end="url(#arrow-teal)"/>
    <line x1="732" y1="212" x2="782" y2="212" stroke="#9a63ef" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <line x1="926" y1="212" x2="976" y2="212" stroke="#27c2bf" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <!-- row 1 nodes -->
    <rect x="648" y="96" width="84" height="56" rx="14" fill="#e8483d"/>
    <text x="690" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">缺胶</text>

    <rect x="776" y="96" width="150" height="56" rx="12" fill="#9a63ef"/>
    <text x="851" y="119" text-anchor="middle" font-size="17" fill="#ffffff">模具温度偏低</text>
    <text x="851" y="141" text-anchor="middle" font-size="17" fill="#ffffff">熔体填充阻力大</text>

    <rect x="970" y="92" width="178" height="64" rx="12" fill="#27c2bf"/>
    <text x="1059" y="118" text-anchor="middle" font-size="16.5" font-weight="600" fill="#141a24">提高模温并稳定</text>
    <text x="1059" y="141" text-anchor="middle" font-size="16.5" font-weight="600" fill="#141a24">3 模后再生产</text>

    <!-- row 2 nodes -->
    <rect x="648" y="184" width="84" height="56" rx="14" fill="#e8483d"/>
    <text x="690" y="219" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">缺胶</text>

    <rect x="776" y="184" width="150" height="56" rx="12" fill="#9a63ef"/>
    <text x="851" y="207" text-anchor="middle" font-size="16.5" fill="#ffffff">注射保压压力不足</text>
    <text x="851" y="229" text-anchor="middle" font-size="16.5" fill="#ffffff">型腔未完全充填</text>

    <rect x="970" y="180" width="178" height="64" rx="12" fill="#27c2bf"/>
    <text x="1059" y="206" text-anchor="middle" font-size="16.5" font-weight="600" fill="#141a24">分级提高注射与</text>
    <text x="1059" y="229" text-anchor="middle" font-size="16.5" font-weight="600" fill="#141a24">保压压力</text>

    <!-- footer entity chain: material, defect, process, device -->
    <g stroke="#7b8596" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
      <line x1="748" y1="330" x2="782" y2="330" marker-end="url(#arrow-dashed)"/>
      <line x1="858" y1="330" x2="894" y2="330" marker-end="url(#arrow-dashed)"/>
      <line x1="1006" y1="330" x2="1038" y2="330" marker-end="url(#arrow-dashed)"/>
    </g>
    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="648" y="311" width="100" height="38" rx="10" fill="none" stroke="#f5a623" stroke-width="1.6"/>
      <text x="698" y="335" fill="#f5a623">ABS 塑胶粒</text>
      <rect x="786" y="311" width="72" height="38" rx="10" fill="none" stroke="#e8483d" stroke-width="1.6"/>
      <text x="822" y="335" fill="#f07068">缺胶</text>
      <rect x="898" y="311" width="108" height="38" rx="10" fill="none" stroke="#12b57a" stroke-width="1.6"/>
      <text x="952" y="335" fill="#27c492">注塑成型</text>
      <rect x="1042" y="311" width="106" height="38" rx="10" fill="none" stroke="#4f8ef7" stroke-width="1.6"/>
      <text x="1095" y="335" fill="#7babf9">1# 注塑机</text>
    </g>

    <!-- entity legend -->
    <g font-size="12.5" fill="#6b7588">
      <circle cx="652" cy="378" r="4" fill="#e8483d"/><text x="662" y="382">不良</text>
      <circle cx="706" cy="378" r="4" fill="#9a63ef"/><text x="716" y="382">原因</text>
      <circle cx="760" cy="378" r="4" fill="#27c2bf"/><text x="770" y="382">对策</text>
      <circle cx="814" cy="378" r="4" fill="#12b57a"/><text x="824" y="382">工序</text>
      <circle cx="868" cy="378" r="4" fill="#f5a623"/><text x="878" y="382">物料</text>
      <circle cx="922" cy="378" r="4" fill="#4f8ef7"/><text x="932" y="382">设备</text>
    </g>
  </g>
</svg>
